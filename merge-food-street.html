<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#1a1225" />
<title>合成美食街 · Merge Food Street</title>
<style>
:root{
  --panel: rgba(255,255,255,.06);
  --stroke: rgba(255,255,255,.13);
  --gold: #ffd166;
  --text: #f5f0ff;
  --dim: #b9aed0;
}
*{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; }
body{
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI','Microsoft YaHei',sans-serif;
  background: radial-gradient(120% 90% at 50% 0%, #35204d 0%, #1a1225 55%, #120b1c 100%);
  color:var(--text); overflow:hidden;
  user-select:none; -webkit-user-select:none; overscroll-behavior:none;
  touch-action: manipulation;
}
body::before,body::after{ content:''; position:fixed; border-radius:50%; filter:blur(90px); opacity:.32; z-index:0; pointer-events:none; }
body::before{ width:42vw;height:42vw; background:#ff6b9d; top:-12vw; left:-14vw; }
body::after{ width:46vw;height:46vw; background:#4cc9f0; bottom:-16vw; right:-15vw; }

#app{ position:relative; z-index:1; height:100dvh; max-width:470px; margin:0 auto;
  display:flex; flex-direction:column; gap:8px; padding:10px 10px calc(10px + env(safe-area-inset-bottom)); }

/* ===== 顶栏 ===== */
#hud{ background:var(--panel); border:1px solid var(--stroke); border-radius:16px; padding:8px 12px; display:flex; flex-direction:column; gap:7px; backdrop-filter:blur(8px); }
.hud-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
.logo{ font-weight:800; font-size:15px; letter-spacing:.5px; white-space:nowrap; }
.res{ display:flex; flex-direction:column; align-items:flex-end; line-height:1.15; }
.coins{ font-size:19px; font-weight:800; color:var(--gold); }
.rate{ font-size:10.5px; color:var(--dim); }
.hud-btns{ display:flex; gap:6px; }
.icon-btn{ width:30px;height:30px; border-radius:10px; border:1px solid var(--stroke); background:var(--panel); color:var(--text); font-size:14px; cursor:pointer; }
.icon-btn:active{ transform:scale(.92); }
.lvl-row{ gap:8px; }
.lvl-chip{ font-size:11px; font-weight:800; background:linear-gradient(150deg,#7c4dd1,#5a2ea1); border-radius:999px; padding:3px 9px; white-space:nowrap; }
.xpbar{ flex:1; height:8px; border-radius:99px; background:rgba(0,0,0,.4); overflow:hidden; border:1px solid rgba(255,255,255,.08); }
#xpfill{ height:100%; width:0%; background:linear-gradient(90deg,#ffd166,#ff9e5e); border-radius:99px; transition:width .25s; }
.xptext{ font-size:10px; color:var(--dim); white-space:nowrap; }

/* ===== 订单 ===== */
#orders{ display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; }
#orders::-webkit-scrollbar{ display:none; }
.order{ position:relative; flex:0 0 48%; background:var(--panel); border:1px solid var(--stroke); border-radius:14px; padding:8px 10px; display:flex; align-items:center; gap:8px; cursor:pointer; backdrop-filter:blur(8px); transition:transform .1s; }
.order:active{ transform:scale(.97); }
.o-emoji{ font-size:30px; line-height:1; filter:drop-shadow(0 3px 4px rgba(0,0,0,.4)); }
.o-info{ flex:1; min-width:0; }
.o-name{ font-size:12px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.o-reward{ font-size:11px; color:var(--gold); font-weight:700; }
.o-xp{ color:var(--dim); font-weight:500; font-size:10px; }
.o-btn{ border:none; border-radius:10px; padding:6px 10px; font-size:11px; font-weight:800; color:#08240f; background:linear-gradient(150deg,#7bd88f,#3fae62); cursor:pointer; font-family:inherit; flex-shrink:0; }
.o-btn.dim{ filter:grayscale(.75) brightness(.75); }
.o-reroll{ position:absolute; top:4px; right:4px; border:none; background:rgba(255,255,255,.1); color:var(--dim); border-radius:8px; font-size:10px; padding:2px 5px; cursor:pointer; }
@keyframes shakeX{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
.order.shake{ animation:shakeX .3s; }

/* ===== 棋盘 ===== */
#board-wrap{ flex:1; display:flex; min-height:0; }
#board{ margin:auto; display:grid; grid-template-columns:repeat(5,1fr); grid-template-rows:repeat(6,1fr); gap:7px;
  width:100%; width:min(100%, calc((100dvh - 330px) * 5 / 6)); aspect-ratio:5/6; }
.cell{ position:relative; border-radius:14px; background:rgba(255,255,255,.045); border:1px solid rgba(255,255,255,.09);
  display:flex; align-items:center; justify-content:center; touch-action:none; cursor:pointer;
  transition:transform .08s, box-shadow .15s, background .15s, border-color .15s; }
.cell .emoji{ font-size:clamp(20px, 8.5vw, 34px); line-height:1; filter:drop-shadow(0 3px 5px rgba(0,0,0,.45)); }
.cell.filled{ background:linear-gradient(155deg, hsla(var(--h),55%,55%,.30), hsla(var(--h),60%,45%,.12)); border-color:hsla(var(--h),70%,65%,.45); box-shadow:inset 0 0 12px hsla(var(--h),60%,50%,.14); }
.cell .badge{ position:absolute; top:4px; left:5px; font-size:9px; font-weight:800; padding:1px 5px; border-radius:8px; background:hsla(var(--h),60%,42%,.9); color:#fff; }
.cell.locked{ background:rgba(0,0,0,.24); border:1.5px dashed rgba(255,255,255,.15); flex-direction:column; gap:1px; }
.cell.locked .lock{ font-size:14px; opacity:.75; }
.cell.locked .price{ font-size:9.5px; color:var(--gold); font-weight:700; }
.cell.lifting{ opacity:.25; }
.cell.drop-here{ outline:2px solid rgba(126,232,250,.9); outline-offset:2px; }
.cell.drop-merge{ outline-color:#7bd88f; box-shadow:0 0 18px rgba(123,216,143,.55); }
@keyframes popIn{ 0%{transform:scale(.2); opacity:0} 60%{transform:scale(1.15)} 100%{transform:scale(1); opacity:1} }
.cell.spawn{ animation:popIn .3s cubic-bezier(.34,1.56,.64,1); }
@keyframes mergedPop{ 0%{transform:scale(1)} 45%{transform:scale(1.28)} 100%{transform:scale(1)} }
.cell.merged{ animation:mergedPop .35s ease; z-index:2; }
.cell.merged::after{ content:''; position:absolute; inset:-4px; border-radius:18px; border:2px solid #fff; opacity:0; animation:ringOut .45s ease-out; }
@keyframes ringOut{ 0%{opacity:.8; transform:scale(.7)} 100%{opacity:0; transform:scale(1.55)} }

.drag-ghost{ position:fixed; z-index:120; pointer-events:none; font-size:44px; line-height:1;
  transform:translate(-50%,-55%) scale(1.25); filter:drop-shadow(0 8px 14px rgba(0,0,0,.5)); }

/* ===== 底部操作 ===== */
#controls{ display:flex; gap:8px; }
.btn{ position:relative; overflow:hidden; flex:1; border:1px solid var(--stroke); background:var(--panel); color:var(--text);
  border-radius:16px; padding:10px 6px; display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer;
  transition:transform .06s, filter .15s; font-family:inherit; touch-action:manipulation; }
.btn:active{ transform:scale(.96); }
.btn:disabled{ filter:grayscale(.75) brightness(.65); cursor:default; }
.btn .b-line1{ font-size:13px; font-weight:800; }
.btn .b-line2{ font-size:10.5px; opacity:.85; }
.btn.primary{ flex:1.35; background:linear-gradient(150deg,#2fae63,#1e7d46); border-color:rgba(61,220,132,.65); }
.btn.premium{ background:linear-gradient(150deg,#7c4dd1,#5a2ea1); border-color:rgba(179,136,255,.4); }
.cd-overlay{ position:absolute; left:0; top:0; bottom:0; width:var(--p,0%); background:rgba(0,0,0,.45); pointer-events:none; transition:width .1s linear; }
@keyframes pulseGlow{ 0%,100%{ box-shadow:0 0 0 0 rgba(123,216,143,.35);} 50%{ box-shadow:0 0 14px 2px rgba(123,216,143,.35);} }
.btn.primary:not(:disabled){ animation:pulseGlow 1.8s infinite; }

/* ===== 特效 / 提示 / 弹窗 ===== */
#fx{ position:fixed; inset:0; pointer-events:none; z-index:90; }
.float{ position:absolute; font-size:13px; font-weight:800; transform:translate(-50%,-50%); animation:floatUp .95s ease-out forwards; text-shadow:0 2px 4px rgba(0,0,0,.6); white-space:nowrap; }
.float.gold{ color:var(--gold); } .float.soft{ color:rgba(255,255,255,.72); font-size:11px; font-weight:600; }
@keyframes floatUp{ 0%{opacity:0; transform:translate(-50%,-30%) scale(.7);} 15%{opacity:1;} 100%{opacity:0; transform:translate(-50%,-170%) scale(1.05);} }
#toasts{ position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:110; display:flex; flex-direction:column; gap:6px; align-items:center; pointer-events:none; width:max-content; max-width:92vw; }
.toast{ background:rgba(22,15,34,.93); border:1px solid var(--stroke); padding:8px 16px; border-radius:999px; font-size:12.5px; animation:toastIn .25s ease; box-shadow:0 6px 18px rgba(0,0,0,.4); }
.toast.err{ border-color:rgba(255,99,132,.5); color:#ffb3c4; }
.toast.ok{ border-color:rgba(125,216,143,.5); color:#c9f2d4; }
@keyframes toastIn{ from{opacity:0; transform:translateY(-8px) scale(.9);} }
#modal{ position:fixed; inset:0; z-index:130; background:rgba(10,6,18,.72); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; padding:20px; }
#modal.hidden{ display:none; }
.modal-card{ width:100%; max-width:340px; background:#241735; border:1px solid var(--stroke); border-radius:20px; padding:20px; text-align:center; animation:popIn .28s cubic-bezier(.34,1.56,.64,1); }
.modal-card h2{ font-size:18px; margin-bottom:8px; }
.modal-card p{ font-size:13px; margin:6px 0; line-height:1.65; }
.big-gold{ font-size:26px; font-weight:800; color:var(--gold); }
.dim{ color:var(--dim); } .small{ font-size:11px; }
.modal-card ul{ text-align:left; font-size:12.5px; line-height:1.95; margin:10px 0 12px; padding-left:18px; color:#d8cfe8; }
.modal-btn{ margin-top:12px; border:none; border-radius:14px; padding:11px 26px; font-size:14px; font-weight:800; color:#08240f; background:linear-gradient(150deg,#7bd88f,#3fae62); cursor:pointer; font-family:inherit; }
.modal-btn.ghost{ background:var(--panel); color:var(--text); border:1px solid var(--stroke); font-weight:600; margin-left:8px; }
.modal-btn.danger{ background:linear-gradient(150deg,#ff6b81,#d63a56); color:#fff; }
.stats-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin:10px 0; }
.stat{ background:rgba(0,0,0,.25); border:1px solid var(--stroke); border-radius:12px; padding:8px 4px; }
.stat b{ display:block; font-size:14px; color:var(--gold); }
.stat span{ font-size:10px; color:var(--dim); }
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="hud-row">
      <div class="logo">🏮 合成美食街</div>
      <div class="res">
        <div class="coins">💰 <span id="coins">0</span></div>
        <div class="rate">每秒 <span id="rate">0</span></div>
      </div>
      <div class="hud-btns">
        <button id="btnMute" class="icon-btn" title="音效">🔊</button>
        <button id="btnHelp" class="icon-btn" title="帮助">❓</button>
      </div>
    </div>
    <div class="hud-row lvl-row">
      <span class="lvl-chip">Lv.<span id="lvl">1</span></span>
      <div class="xpbar"><div id="xpfill"></div></div>
      <span id="xptext" class="xptext">0/60</span>
    </div>
  </header>

  <section id="orders"></section>

  <main id="board-wrap"><div id="board"></div></main>

  <footer id="controls">
    <button id="btnFree" class="btn primary">
      <div class="cd-overlay"></div>
      <div class="b-line1">🧺 免费进货</div>
      <div class="b-line2" id="freeSub">已就绪</div>
    </button>
    <button id="btnBox1" class="btn">
      <div class="b-line1">📦 普通箱</div>
      <div class="b-line2" id="box1Sub">100 💰</div>
    </button>
    <button id="btnBox2" class="btn premium">
      <div class="b-line1">🎁 高级箱</div>
      <div class="b-line2" id="box2Sub">1200 💰</div>
    </button>
  </footer>
</div>

<div id="fx"></div>
<div id="toasts"></div>
<div id="modal" class="hidden"><div class="modal-card" id="modalCard"></div></div>

<script>
'use strict';
/* ================= 配置 ================= */
const TIERS = [null,
  {name:'玉米',    emoji:'🌽', income:0.5},
  {name:'薯条',    emoji:'🍟', income:2},
  {name:'汉堡',    emoji:'🍔', income:8},
  {name:'披萨',    emoji:'🍕', income:32},
  {name:'塔可',    emoji:'🌮', income:120},
  {name:'寿司',    emoji:'🍣', income:450},
  {name:'牛排',    emoji:'🥩', income:1700},
  {name:'拉面',    emoji:'🍜', income:6500},
  {name:'咖喱饭',  emoji:'🍛', income:25000},
  {name:'龙虾',    emoji:'🦞', income:95000},
  {name:'蛋糕',    emoji:'🍰', income:360000},
  {name:'冰淇淋',  emoji:'🍦', income:1400000},
  {name:'香槟',    emoji:'🥂', income:5200000},
  {name:'米其林',  emoji:'🏆', income:20000000},
  {name:'美食帝国',emoji:'👑', income:78000000},
];
const MAX_TIER = 15;
const COLS = 5, ROWS = 6, N = 30;
const ROW_PRICE = [0, 0, 0, 800, 9000, 90000];   // 每行扩建单价
const BOX1_COST = 100, BOX2_COST = 1200, REROLL_COST = 50;
const OFFLINE_RATE = 0.5, OFFLINE_CAP = 8 * 3600;
const SAVE_KEY = 'mergeFoodStreet.v1';
const FREE_CD_BASE = 3000;

/* ================= 工具 ================= */
const $ = id => document.getElementById(id);
const fmt = n => {
  if (n < 1000) return (n < 10 && !Number.isInteger(n)) ? n.toFixed(1) : String(Math.floor(n));
  const units = ['k','M','B','T','Qa','Qi'];
  let u = -1;
  while (n >= 1000 && u < units.length - 1) { n /= 1000; u++; }
  return (n >= 100 ? n.toFixed(0) : n.toFixed(1)) + units[u];
};
const hueOf = t => (t - 1) * 26 + 8;
const rowOf = i => Math.floor(i / COLS);
const rand = a => a[(Math.random() * a.length) | 0];

/* ================= 状态 ================= */
function makeOrderRaw(cap) {
  const c = Math.max(2, Math.min(cap, 13));
  const pool = [];
  for (let t = 1; t <= c; t++) { const w = c - t + 2; for (let k = 0; k < w; k++) pool.push(t); }
  const tier = rand(pool);
  const qty = Math.random() < 0.3 ? 2 : 1;
  const reward = Math.round(TIERS[tier].income * 90 * qty * (1.1 + Math.random() * 0.5));
  return { tier, qty, reward };
}
function newState() {
  const cells = Array(N).fill(null);
  const unlocked = Array(N).fill(false);
  for (let i = 0; i < 15; i++) unlocked[i] = true;
  cells[7] = { tier: 1 }; cells[12] = { tier: 1 }; cells[10] = { tier: 2 };
  return {
    v: 1, coins: 300, level: 1, xp: 0, cells, unlocked,
    orders: [makeOrderRaw(2), makeOrderRaw(2), makeOrderRaw(3)],
    freeReadyAt: 0, muted: false, lastSeen: Date.now(),
    stats: { merges: 0, orders: 0, earned: 0 }
  };
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (!s || s.v !== 1) return false;
    state = Object.assign(newState(), s);
    state.stats = Object.assign({ merges: 0, orders: 0, earned: 0 }, s.stats);
    if (!Array.isArray(state.orders)) state.orders = [];
    while (state.orders.length < 3) state.orders.push(makeOrderRaw(3));
    state.orders = state.orders.slice(0, 3);
    return true;
  } catch (e) { return false; }
}
function save() {
  try {
    state.lastSeen = Date.now();
    localStorage.setItem(SAVE_KEY, JSON.stringify(state));
  } catch (e) {}
}
let state = null;

/* ================= 音效 ================= */
let AC = null;
function ac() { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); return AC; }
function beep(f, d, type, v, at) {
  if (state && state.muted) return;
  try {
    const c = ac(), o = c.createOscillator(), g = c.createGain(), t0 = c.currentTime + (at || 0);
    o.type = type || 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(v || 0.12, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0 + d + 0.02);
  } catch (e) {}
}
const SFX = {
  merge() { beep(520, .07, 'triangle', .14); beep(780, .1, 'triangle', .12, .05); },
  spawn() { beep(300, .06, 'sine', .1); },
  coin()  { beep(880, .05, 'square', .05); beep(1320, .08, 'square', .045, .04); },
  error() { beep(160, .12, 'sawtooth', .07); },
  click() { beep(600, .03, 'sine', .05); },
  level() { beep(523, .09, 'triangle', .12); beep(659, .09, 'triangle', .12, .09); beep(784, .14, 'triangle', .12, .18); }
};

/* ================= DOM ================= */
const boardEl = $('board'), ordersEl = $('orders'), fxEl = $('fx'), toastsEl = $('toasts');
const coinsEl = $('coins'), rateEl = $('rate'), lvlEl = $('lvl'), xpfill = $('xpfill'), xptext = $('xptext');
const btnFree = $('btnFree'), freeSub = $('freeSub');
const btnBox1 = $('btnBox1'), btnBox2 = $('btnBox2');
const modalEl = $('modal'), modalCard = $('modalCard');
let cellEls = [];

function buildBoard() {
  boardEl.innerHTML = '';
  cellEls = [];
  for (let i = 0; i < N; i++) {
    const d = document.createElement('div');
    d.className = 'cell';
    d.dataset.idx = i;
    boardEl.appendChild(d);
    cellEls.push(d);
  }
}

/* ================= 渲染 ================= */
function renderBoard() {
  for (let i = 0; i < N; i++) {
    const el = cellEls[i];
    const item = state.cells[i];
    const locked = !state.unlocked[i];
    el.className = 'cell' + (locked ? ' locked' : '') + (item ? ' filled' : '');
    el.style.setProperty('--h', item ? hueOf(item.tier) : 260);
    if (locked) {
      el.innerHTML = `<div class="lock">🔒</div><div class="price">${fmt(ROW_PRICE[rowOf(i)])}💰</div>`;
    } else if (item) {
      el.innerHTML = `<span class="badge">${item.tier}</span><span class="emoji">${TIERS[item.tier].emoji}</span>`;
    } else {
      el.innerHTML = '';
    }
  }
}
function renderOrders() {
  ordersEl.innerHTML = state.orders.map((o, i) => {
    const t = TIERS[o.tier];
    let have = 0;
    state.cells.forEach(c => { if (c && c.tier === o.tier) have++; });
    const ok = have >= o.qty;
    return `<div class="order" data-i="${i}">
      <button class="o-reroll" data-reroll="${i}" title="换一单 ${REROLL_COST}💰">🔄</button>
      <div class="o-emoji">${t.emoji}</div>
      <div class="o-info">
        <div class="o-name">${t.name} <b>×${o.qty}</b></div>
        <div class="o-reward">+${fmt(o.reward)}💰 <span class="o-xp">+${o.qty * 12}XP</span></div>
      </div>
      <button class="o-btn${ok ? '' : ' dim'}" data-i="${i}">交付</button>
    </div>`;
  }).join('');
}
function incomeRate() {
  let r = 0;
  for (const c of state.cells) if (c) r += TIERS[c.tier].income;
  return r;
}
function updateHUD() {
  coinsEl.textContent = fmt(state.coins);
  rateEl.textContent = fmt(incomeRate()) + '/s';
  lvlEl.textContent = state.level;
  const need = xpNeed(state.level);
  xpfill.style.width = Math.min(100, state.xp / need * 100) + '%';
  xptext.textContent = fmt(Math.floor(state.xp)) + '/' + fmt(need);
  updateButtons();
}
function updateButtons() {
  const now = Date.now();
  const cd = freeCd();
  const rem = Math.max(0, state.freeReadyAt - now);
  if (rem > 0) {
    btnFree.disabled = true;
    btnFree.style.setProperty('--p', (rem / cd * 100) + '%');
    freeSub.textContent = (rem / 1000).toFixed(1) + 's';
  } else {
    btnFree.disabled = false;
    btnFree.style.setProperty('--p', '0%');
    freeSub.textContent = '已就绪';
  }
  const hasEmpty = emptyIdxs().length > 0;
  btnBox1.disabled = state.coins < BOX1_COST || !hasEmpty;
  btnBox2.disabled = state.coins < BOX2_COST || !hasEmpty;
}
function renderAll() { renderBoard(); renderOrders(); updateHUD(); }
function syncGame() { renderBoard(); renderOrders(); updateHUD(); save(); }

/* ================= 数值 ================= */
function xpNeed(l) { return Math.round(60 * Math.pow(l, 1.7)); }
function freeCd() { return Math.max(1200, Math.round(FREE_CD_BASE * Math.pow(0.96, state.level - 1))); }
function maxTierOnBoard() {
  let m = 0;
  for (const c of state.cells) if (c && c.tier > m) m = c.tier;
  return m;
}
function addXP(x) {
  state.xp += x;
  while (state.xp >= xpNeed(state.level)) {
    state.xp -= xpNeed(state.level);
    state.level++;
    const bonus = state.level * state.level * 50;
    state.coins += bonus; state.stats.earned += bonus;
    SFX.level();
    toast(`🎉 升到 Lv.${state.level}！奖励 ${fmt(bonus)}💰，进货加速`, 'ok');
  }
  updateHUD();
}

/* ================= 特效 ================= */
function floatAt(el, text, cls) {
  if (!el) return;
  const r = el.getBoundingClientRect();
  const s = document.createElement('span');
  s.className = 'float ' + (cls || '');
  s.textContent = text;
  s.style.left = (r.left + r.width / 2) + 'px';
  s.style.top = (r.top + r.height / 3) + 'px';
  fxEl.appendChild(s);
  setTimeout(() => s.remove(), 1000);
}
function toast(msg, type) {
  const d = document.createElement('div');
  d.className = 'toast ' + (type || '');
  d.textContent = msg;
  toastsEl.appendChild(d);
  setTimeout(() => d.remove(), 2100);
}
function showModal(html) { modalCard.innerHTML = html; modalEl.classList.remove('hidden'); }
function closeModal() { modalEl.classList.add('hidden'); resetArmed = false; }

/* ================= 核心玩法 ================= */
function emptyIdxs() {
  const a = [];
  state.unlocked.forEach((u, i) => { if (u && !state.cells[i]) a.push(i); });
  return a;
}
function spawnItem(tier) {
  const a = emptyIdxs();
  if (!a.length) return false;
  const i = rand(a);
  state.cells[i] = { tier };
  renderBoard(); renderOrders();
  const el = cellEls[i];
  el.classList.remove('spawn'); void el.offsetWidth; el.classList.add('spawn');
  return true;
}
function doMerge(src, dst) {
  const t = state.cells[src].tier + 1;
  state.cells[src] = null;
  state.cells[dst] = { tier: t };
  const bonus = TIERS[t].income * 12;
  state.coins += bonus;
  state.stats.earned += bonus;
  state.stats.merges++;
  addXP(t * 4);
  SFX.merge();
  syncGame();
  const el = cellEls[dst];
  el.classList.remove('merged'); void el.offsetWidth; el.classList.add('merged');
  floatAt(el, `+${fmt(bonus)}💰`, 'gold');
}
function fulfill(i) {
  const o = state.orders[i];
  if (!o) return;
  const idxs = [];
  state.cells.forEach((c, k) => { if (c && c.tier === o.tier) idxs.push(k); });
  if (idxs.length < o.qty) {
    const card = ordersEl.querySelector(`.order[data-i="${i}"]`);
    if (card) { card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); }
    SFX.error();
    toast(`需要 ${o.qty} 个「${TIERS[o.tier].name}」，棋盘上只有 ${idxs.length} 个`, 'err');
    return;
  }
  for (let k = 0; k < o.qty; k++) state.cells[idxs[k]] = null;
  state.coins += o.reward;
  state.stats.earned += o.reward;
  state.stats.orders++;
  addXP(o.qty * 12);
  SFX.coin();
  const card = ordersEl.querySelector(`.order[data-i="${i}"]`);
  floatAt(card, `+${fmt(o.reward)}💰`, 'gold');
  state.orders[i] = makeOrderRaw(Math.max(2, maxTierOnBoard() + 1));
  syncGame();
}
function reroll(i) {
  if (state.coins < REROLL_COST) { SFX.error(); toast('金币不足', 'err'); return; }
  state.coins -= REROLL_COST;
  state.orders[i] = makeOrderRaw(Math.max(2, maxTierOnBoard() + 1));
  SFX.click();
  renderOrders(); updateHUD(); save();
}
function rollTier(min, max) {
  const pool = [];
  for (let t = min; t <= max; t++) { const w = max - t + 1; for (let k = 0; k < w; k++) pool.push(t); }
  return rand(pool);
}
function buyBox(cost, roll) {
  if (state.coins < cost) { SFX.error(); toast('金币不足', 'err'); return; }
  if (!emptyIdxs().length) { SFX.error(); toast('棋盘已满，先合成腾出格子', 'err'); return; }
  state.coins -= cost;
  const t = roll();
  spawnItem(t);
  SFX.spawn();
  toast(`开出「${TIERS[t].name}」 Lv.${t}`, 'ok');
  updateHUD(); save();
}
function tryBuyCell(idx) {
  const price = ROW_PRICE[rowOf(idx)];
  if (state.coins < price) { SFX.error(); toast(`扩建该格需要 ${fmt(price)}💰`, 'err'); return; }
  state.coins -= price;
  state.unlocked[idx] = true;
  addXP(20);
  SFX.coin();
  toast('扩建成功！', 'ok');
  syncGame();
  const el = cellEls[idx];
  el.classList.remove('spawn'); void el.offsetWidth; el.classList.add('spawn');
}

/* ================= 拖拽 ================= */
let drag = null;
boardEl.addEventListener('pointerdown', e => {
  if (drag) return;
  const cellEl = e.target.closest('.cell');
  if (!cellEl) return;
  const idx = +cellEl.dataset.idx;
  if (!state.cells[idx]) return;
  e.preventDefault();
  const ghost = document.createElement('div');
  ghost.className = 'drag-ghost';
  ghost.textContent = TIERS[state.cells[idx].tier].emoji;
  ghost.style.left = e.clientX + 'px';
  ghost.style.top = e.clientY + 'px';
  document.body.appendChild(ghost);
  cellEl.classList.add('lifting');
  drag = { idx, ghost, pid: e.pointerId, targetIdx: null };
});
window.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.pid) return;
  drag.ghost.style.left = e.clientX + 'px';
  drag.ghost.style.top = e.clientY + 'px';
  const el = document.elementsFromPoint(e.clientX, e.clientY)
    .find(n => n.classList && n.classList.contains('cell') && !n.classList.contains('locked'));
  setDropTarget(el ? +el.dataset.idx : null);
});
function setDropTarget(idx) {
  if (drag.targetIdx === idx) return;
  if (drag.targetIdx != null) {
    const p = cellEls[drag.targetIdx];
    p.classList.remove('drop-here', 'drop-merge');
  }
  drag.targetIdx = idx;
  if (idx != null) {
    const el = cellEls[idx];
    el.classList.add('drop-here');
    const srcT = state.cells[drag.idx].tier;
    const dst = state.cells[idx];
    if (dst && dst.tier === srcT && srcT < MAX_TIER) el.classList.add('drop-merge');
  }
}
window.addEventListener('pointerup', e => {
  if (!drag || e.pointerId !== drag.pid) return;
  finishDrag();
});
window.addEventListener('pointercancel', () => { if (drag) finishDrag(); });

function finishDrag() {
  const d = drag;
  drag = null;
  d.ghost.remove();
  cellEls.forEach(c => c.classList.remove('lifting', 'drop-here', 'drop-merge'));
  const dstIdx = d.targetIdx;
  if (dstIdx == null || dstIdx === d.idx) { renderBoard(); return; }
  const a = state.cells[d.idx], b = state.cells[dstIdx];
  if (!b) {
    state.cells[dstIdx] = a; state.cells[d.idx] = null;
    SFX.click();
  } else if (b.tier === a.tier && a.tier < MAX_TIER) {
    doMerge(d.idx, dstIdx);
    return;
  } else {
    state.cells[dstIdx] = a; state.cells[d.idx] = b;
    SFX.click();
  }
  syncGame();
}
boardEl.addEventListener('animationend', e => {
  const el = e.target.closest('.cell');
  if (el) el.classList.remove('spawn', 'merged');
});
boardEl.addEventListener('contextmenu', e => e.preventDefault());
boardEl.addEventListener('click', e => {
  const cellEl = e.target.closest('.cell');
  if (!cellEl) return;
  const idx = +cellEl.dataset.idx;
  if (!state.unlocked[idx]) tryBuyCell(idx);
});

/* ================= 按钮 ================= */
btnFree.addEventListener('click', () => {
  if (Date.now() < state.freeReadyAt) return;
  if (!emptyIdxs().length) { SFX.error(); toast('棋盘已满，先合成腾出格子', 'err'); return; }
  const tier = Math.random() < 0.78 ? 1 : 2;
  spawnItem(tier);
  state.freeReadyAt = Date.now() + freeCd();
  SFX.spawn();
  updateHUD(); save();
});
btnBox1.addEventListener('click', () => buyBox(BOX1_COST, () => rollTier(1, 3)));
btnBox2.addEventListener('click', () => buyBox(BOX2_COST, () => rollTier(3, 6)));

ordersEl.addEventListener('click', e => {
  const r = e.target.closest('[data-reroll]');
  if (r) { reroll(+r.dataset.reroll); return; }
  const b = e.target.closest('[data-i]');
  if (b) fulfill(+b.dataset.i);
});

$('btnMute').addEventListener('click', () => {
  state.muted = !state.muted;
  $('btnMute').textContent = state.muted ? '🔇' : '🔊';
  save();
});
$('btnHelp').addEventListener('click', showHelp);

modalEl.addEventListener('click', e => {
  if (e.target === modalEl || e.target.closest('[data-close]')) closeModal();
});
let resetArmed = false;
modalCard.addEventListener('click', e => {
  const r = e.target.closest('[data-reset]');
  if (!r) return;
  if (!resetArmed) {
    resetArmed = true;
    r.textContent = '再点一次确认清档';
    r.classList.add('danger');
    return;
  }
  localStorage.removeItem(SAVE_KEY);
  state = newState();
  $('btnMute').textContent = '🔊';
  closeModal();
  renderAll();
  save();
  toast('已重置存档', 'ok');
});

/* ================= 帮助 / 离线 ================= */
function showHelp() {
  const s = state.stats;
  showModal(`
    <h2>🏮 玩法说明</h2>
    <ul>
      <li><b>拖动</b>两个相同食物到一起 → 合成更高级美食（共 15 级）</li>
      <li>每个美食<b>每秒自动产出</b>金币，等级越高产出越高</li>
      <li>完成<b>顾客订单</b>获得大额金币与经验</li>
      <li>🧺 免费进货有冷却；📦🎁 箱子必得食物</li>
      <li>点击 🔒 格子花金币<b>扩建</b>美食街</li>
      <li>离线时美食街以 50% 效率继续赚钱（上限 8 小时）</li>
    </ul>
    <div class="stats-grid">
      <div class="stat"><b>${fmt(s.earned)}</b><span>累计收益</span></div>
      <div class="stat"><b>${fmt(s.merges)}</b><span>合成次数</span></div>
      <div class="stat"><b>${fmt(s.orders)}</b><span>完成订单</span></div>
    </div>
    <button class="modal-btn" data-close>开始经营</button>
    <button class="modal-btn ghost" data-reset>重置存档</button>
  `);
}
function offlineCheck() {
  const dt = (Date.now() - state.lastSeen) / 1000;
  const rate = incomeRate();
  if (dt > 60 && rate > 0) {
    const eff = Math.min(dt, OFFLINE_CAP);
    const gain = rate * OFFLINE_RATE * eff;
    if (gain >= 1) {
      state.coins += gain;
      state.stats.earned += gain;
      const h = Math.floor(dt / 3600), m = Math.floor((dt % 3600) / 60);
      showModal(`
        <h2>欢迎回来 🏮</h2>
        <p class="dim">离线 ${h > 0 ? h + ' 小时 ' : ''}${m} 分钟</p>
        <p>美食街替你赚了</p>
        <p class="big-gold">+${fmt(gain)} 💰</p>
        <p class="dim small">（按 50% 收益率结算，上限 8 小时）</p>
        <button class="modal-btn" data-close>开心收下</button>
      `);
      SFX.coin();
    }
  }
}

/* ================= 主循环 ================= */
setInterval(() => {
  const r = incomeRate();
  if (r > 0) { state.coins += r * 0.1; state.stats.earned += r * 0.1; }
  updateHUD();
}, 100);
setInterval(save, 4000);
setInterval(() => {                      // 漂浮收益数字（氛围）
  const occ = [];
  state.cells.forEach((c, i) => { if (c) occ.push(i); });
  if (occ.length) {
    const i = rand(occ), c = state.cells[i];
    floatAt(cellEls[i], '+' + fmt(TIERS[c.tier].income * 2.6) + '💰', 'soft');
  }
}, 2600);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
window.addEventListener('pagehide', save);
document.addEventListener('pointerdown', () => { try { ac().resume(); } catch (e) {} });

/* ================= 启动 ================= */
buildBoard();
const hadSave = load();
if (!state) state = newState();
$('btnMute').textContent = state.muted ? '🔇' : '🔊';
renderAll();
if (hadSave) offlineCheck(); else save();
</script>
</body>
</html>
